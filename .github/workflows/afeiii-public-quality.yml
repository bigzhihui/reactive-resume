name: Afeiii frontend quality
on:
  push:
    branches: [brand/thirteen-month-v6]
  pull_request:
    branches: [brand/thirteen-month-v6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pdf:translations
      - run: pnpm --filter web build
      - run: pnpm --filter web typecheck
      - run: pnpm --filter @reactive-resume/ui typecheck
      - run: pnpm --filter @reactive-resume/ui exec vitest run src/components/button.test.tsx
      - run: node tooling/quality/stage-web.mjs "${RUNNER_TEMP}/resume-public-quality"
      - name: Validate generated HTML and local links
        env:
          QUALITY_SCRIPT_SHA256: 5becf9c6ed5dd4b337082f8d844aafcb35ac467baa23035052163d66db98e71e
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/bigzhihui/afeiii-portal/a86bb6a690add16309c6b7db826b0d5a400dee4f/scripts/check_generated_quality.py' --output "${RUNNER_TEMP}/check_generated_quality.py"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"check_generated_quality.py"; assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["QUALITY_SCRIPT_SHA256"], "Quality checker integrity mismatch"'
          python3 "${RUNNER_TEMP}/check_generated_quality.py" --bootstrap --root "${RUNNER_TEMP}/resume-public-quality" --tools "${RUNNER_TEMP}/afeiii-quality-tools" --baseline tooling/quality/baseline.json --output "${RUNNER_TEMP}/resume-quality.json"
