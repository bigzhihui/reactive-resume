name: ✨ 功能建议

description: 为十三月简历提出具体的改进建议

labels: ["enhancement", "status: needs triage"]
assignees: []

body:
  - type: checkboxes
    attributes:
      label: 已有反馈
      description: 提交前，请先搜索已打开和已关闭的建议。
      options:
        - label: 我已搜索已有建议，没有找到相同提议。
          required: true

  - type: dropdown
    id: variant
    attributes:
      label: 使用方式
      description: 这个建议主要针对本站，还是你自行部署的版本？
      options:
        - 在线站点（resume.afeiii.com）
        - 自行部署
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及功能
      description: 请选择与建议最相关的功能。
      options:
        - 简历编辑与数据
        - 模板、预览与导出
        - 账号与分享
        - AI 与助手
        - 语言与中文界面
        - 自托管部署
        - API 与集成
        - 申请记录与求职信
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 希望十三月简历解决什么使用问题或限制？
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望效果
      description: 请说明你希望达到的效果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 请说明目前使用的解决办法或替代方案；没有时请填写“无”。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 建议范围
      description: 请说明这个建议需要覆盖哪些使用场景。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可补充示例、界面草图或相关反馈；请先移除个人简历信息。
